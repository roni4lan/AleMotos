version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ale_motos_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ale_motos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ale_motos_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ale_motos_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ale_motos_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ale_motos_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://192.168.1.12:${BACKEND_PORT:-3000}/api
      BACKEND_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - ale_motos_network

volumes:
  ale_motos_data:
    name: ale_motos_data

networks:
  ale_motos_network:
    name: ale_motos_network
    driver: bridge
